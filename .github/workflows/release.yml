name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # Das Web-Repo zieht openapi.json aus dem Release (Vertrag Backend → Web)
  assets:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: gh release upload ${{ needs.release-please.outputs.tag }} openapi.json
        env:
          GH_TOKEN: ${{ github.token }}
