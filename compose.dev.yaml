# Infrastructure for local development. The services themselves run on the host via `just dev`.
name: harrier-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harrier
      POSTGRES_PASSWORD: harrier
      POSTGRES_DB: harrier
    ports:
      - "5433:5432" # 5433 on the host, so a local Postgres on 5432 does not get in the way
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harrier"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222" # Monitoring: http://localhost:8222

volumes:
  postgres:
