# Test copy of harrier-gg/templates valheim/bepinex; the install script is inlined as a stub.
schemaVersion: 1
id: valheim/bepinex
game:
  id: valheim
  name: Valheim
variant:
  id: bepinex
  name: BepInEx
  description:
    en: A brutal exploration and survival game for 1-10 players, set in a procedurally-generated purgatory inspired by viking culture, with the BepInEx mod loader.
install:
  method: script
  image: ghcr.io/parkervcp/installers:debian
  entrypoint: bash
  script: echo install
runtime:
  image: ghcr.io/parkervcp/games:valheim
  mountPath: /home/container
  startup: export DOORSTOP_ENABLED=1; export DOORSTOP_TARGET_ASSEMBLY=./BepInEx/core/BepInEx.Preloader.dll; export LD_LIBRARY_PATH="./doorstop_libs:./linux64:$LD_LIBRARY_PATH"; export LD_PRELOAD="libdoorstop_x64.so:$LD_PRELOAD"; export LD_LIBRARY_PATH="./linux64:$LD_LIBRARY_PATH"; export SteamAppId=892970; ./valheim_server.x86_64 -nographics -batchmode -name "{{SERVER_NAME}}" -port {{SERVER_PORT}} -world "{{WORLD}}" -password "{{PASSWORD}}" -public {{PUBLIC_SERVER}} -saveinterval {{BACKUP_INTERVAL}} -backups {{BACKUP_COUNT}} -backupshort {{BACKUP_SHORTTIME}} -backuplong {{BACKUP_LONGTIME}} $( [[ {{ENABLE_CROSSPLAY}} -eq 1 ]] && echo " -crossplay ") > >(sed -uE "{{CONSOLE_FILTER}}")
  env:
    BEPINEX_URL: https://thunderstore.io/api/experimental/package/denikson/BepInExPack_Valheim/
    CONSOLE_FILTER: /^\(Filename:.*Line:[[:space:]]+[[:digit:]]+\)$/d; /^([[:space:]]+)?$/d
    LD_LIBRARY_PATH: ./linux64
    SRCDS_APPID: "896660"
ports:
  - name: game
    container: 2456
    protocol: udp
    offset: 0
    samePort: true
  - name: query
    container: 2457
    protocol: udp
    offset: 1
    samePort: true
config:
  - key: autoUpdate
    label:
      en: Auto Update
    type: boolean
    default: true
    values:
      on: "1"
      off: "0"
    env: AUTO_UPDATE
  - key: backupCount
    label:
      en: Backup Count
    type: integer
    default: 4
    min: 0
    env: BACKUP_COUNT
  - key: backupInterval
    label:
      en: Backup Interval
    type: integer
    default: 1800
    min: 0
    env: BACKUP_INTERVAL
  - key: backupLongtime
    label:
      en: Backup Longtime
    type: integer
    default: 43200
    min: 0
    env: BACKUP_LONGTIME
  - key: backupShorttime
    label:
      en: Backup Shorttime
    type: integer
    default: 7200
    min: 0
    env: BACKUP_SHORTTIME
  - key: enableCrossplay
    label:
      en: Enable Crossplay
    type: boolean
    default: false
    values:
      on: "1"
      off: "0"
    env: ENABLE_CROSSPLAY
  - key: password
    label:
      en: Server Password
    type: secret
    default: ""
    pattern: ^.{5,20}$
    env: PASSWORD
  - key: publicServer
    label:
      en: Public Server
    type: boolean
    default: true
    values:
      on: "1"
      off: "0"
    env: PUBLIC_SERVER
  - key: serverName
    label:
      en: Server Name
    type: string
    default: My Server
    pattern: ^.{1,60}$
    env: SERVER_NAME
  - key: srcdsBetaid
    label:
      en: Beta Branch
    type: string
    default: ""
    pattern: ^.{0,30}$
    env: SRCDS_BETAID
  - key: srcdsBetapass
    label:
      en: Beta Password
    type: string
    default: ""
    pattern: ^.{0,30}$
    env: SRCDS_BETAPASS
  - key: world
    label:
      en: World Name
    type: string
    default: Dedicated
    pattern: ^.{1,20}$
    env: WORLD
  - key: memory
    label:
      en: Memory (MB)
      de: Arbeitsspeicher (MB)
    type: integer
    default: 4096
    min: 1024
    max: 65536
    limit: memory
lifecycle:
  ready: Game server connected
  stop:
    signal: SIGINT
  stopTimeoutSecs: 60
capabilities:
  players:
    protocol: a2s
    port: query
  backup:
    exclude:
      - steamcmd
      - steamapps
      - linux64
      - linux32
      - valheim_server_Data
      - .steam
      - "*.x86_64"
      - "*.so"
      - "*.sh"
      - doorstop_libs
content:
  - kind: mod
    label: { en: Mods, de: Mods }
    path: BepInEx/plugins
    sources:
      - { provider: thunderstore, community: valheim, provides: [denikson-BepInExPack_Valheim] }
